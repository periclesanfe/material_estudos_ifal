name: CI Pipeline

# Valida Pull Requests antes do merge. O push na main é coberto pelo workflow
# Deploy to GitHub Pages (que também compila), então o CI não roda em push
# para evitar duas execuções no mesmo commit.
on:
  pull_request:
    branches: [ "main" ]

# Cancela execuções anteriores ainda em andamento para o mesmo PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-check:
    name: Code Quality & Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type checking
        # `tsc --noEmit` compilava ZERO arquivos: o tsconfig.json da raiz tem
        # "files": [] e só aponta references, então o comando não enxergava src/.
        # O gate passava sempre, inclusive com erro de tipo no código. `tsc -b`
        # constrói os projetos referenciados, que é o que de fato checa.
        run: npx tsc -b

      - name: Run ESLint
        run: npm run lint

      - name: Build validation
        # Garante que o projeto consegue ser compilado com sucesso
        run: npm run build
