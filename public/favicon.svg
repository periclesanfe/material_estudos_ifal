<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    Marca "SI" (Sistemas de Informação).

    As letras são paths, não <text>: um favicon é renderizado fora da página e
    não tem acesso à Orbitron carregada via Google Fonts, então um <text
    font-family="Orbitron"> cairia numa fonte genérica. Os contornos abaixo
    reproduzem o desenho da Orbitron Black — hastes retas, cantos chanfrados,
    terminais horizontais.

    O brilho é um <feGaussianBlur> sobre uma cópia das letras, por baixo delas.
  -->
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
      </feMerge>
    </filter>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eaf9ff" />
      <stop offset="100%" stop-color="#a5e0ff" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="#0f0f12" />

  <!-- Camada de brilho: mesmas formas, borradas, em ciano saturado. -->
  <g filter="url(#glow)" fill="#3ec8ff" opacity="0.95">
    <path d="M13 21.5 L15.5 17 L34 17 L34 24 L20.5 24 L20.5 28.5 L31.5 28.5 L34 33 L34 43 L31.5 47 L13 47 L13 40 L26.5 40 L26.5 35.5 L15.5 35.5 L13 31 Z" />
    <path d="M41.5 17 L49 17 L49 47 L41.5 47 Z" />
  </g>

  <!-- Letras nítidas por cima do halo. -->
  <g fill="url(#ink)">
    <path d="M13 21.5 L15.5 17 L34 17 L34 24 L20.5 24 L20.5 28.5 L31.5 28.5 L34 33 L34 43 L31.5 47 L13 47 L13 40 L26.5 40 L26.5 35.5 L15.5 35.5 L13 31 Z" />
    <path d="M41.5 17 L49 17 L49 47 L41.5 47 Z" />
  </g>
</svg>
